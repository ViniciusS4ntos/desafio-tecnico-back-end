version: '3.8'

services:
  crud-backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      # aqui troca se for rodar com docker
      - SPRING_PROFILES_ACTIVE=prod
      - API_SECRET_KEY="chaveGrandeEnormeGigante123"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=crud_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"